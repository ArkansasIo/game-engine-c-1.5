name: Ethereal Veni .NET

on:
  push:
    branches: [ main, ethereal-veni-next ]
    paths:
      - 'EtherealVeni/**'
      - '.github/workflows/ethereal-veni-dotnet.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'EtherealVeni/**'
      - '.github/workflows/ethereal-veni-dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore engine
        run: dotnet restore EtherealVeni/Engine/EtherealVeni.Engine.csproj
      - name: Build engine
        run: dotnet build EtherealVeni/Engine/EtherealVeni.Engine.csproj -c Release --no-restore
      - name: Restore server
        run: dotnet restore EtherealVeni/Server/EtherealVeni.Server.csproj
      - name: Build server
        run: dotnet build EtherealVeni/Server/EtherealVeni.Server.csproj -c Release --no-restore

  windows-applications:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore Game
        run: dotnet restore EtherealVeni/Game/EthereoPandora.Game.csproj
      - name: Build Game
        run: dotnet build EtherealVeni/Game/EthereoPandora.Game.csproj -c Release --no-restore
      - name: Restore Editor
        run: dotnet restore EtherealVeni/Editor/EtherealVeni.Editor.csproj
      - name: Build Editor
        run: dotnet build EtherealVeni/Editor/EtherealVeni.Editor.csproj -c Release --no-restore
      - name: Publish Game
        run: dotnet publish EtherealVeni/Game/EthereoPandora.Game.csproj -c Release -r win-x64 --self-contained false -o Output/Game/Windows-x64
      - name: Publish Editor
        run: dotnet publish EtherealVeni/Editor/EtherealVeni.Editor.csproj -c Release -r win-x64 --self-contained false -o Output/Editor/Windows-x64
      - name: Upload Windows prototypes
        uses: actions/upload-artifact@v4
        with:
          name: ethereal-veni-windows-prototypes
          path: Output/
          if-no-files-found: error
