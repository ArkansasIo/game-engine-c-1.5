name: Build Ethereal Veni

on:
  workflow_dispatch:
  push:
    paths:
      - 'EtherealVeni/**'
      - '.github/workflows/build-ethereal-veni.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EtherealVeni/EtherealVeni.sln

      - name: Build Editor
        run: dotnet build EtherealVeni/Editor/EtherealVeni.Editor.csproj -c Release --no-restore

      - name: Build Game
        run: dotnet build EtherealVeni/Game/EthereoPandora.Game.csproj -c Release --no-restore

      - name: Publish Editor
        run: dotnet publish EtherealVeni/Editor/EtherealVeni.Editor.csproj -c Release -r win-x64 --self-contained false -o Output/Editor/win-x64

      - name: Publish Game
        run: dotnet publish EtherealVeni/Game/EthereoPandora.Game.csproj -c Release -r win-x64 --self-contained false -o Output/Game/win-x64

      - name: Upload Windows prototypes
        uses: actions/upload-artifact@v4
        with:
          name: ethereal-veni-windows-prototype
          path: Output/
